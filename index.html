<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Hardware-KI Prototyp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f4f4f9;
        }
        
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        
        textarea {
            width: 100%;
            height: 100px;
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        
        button:hover {
            background-color: #0056b3;
        }
        
        .output-box {
            margin-top: 25px;
            padding: 15px;
            background: #e9ecef;
            border-left: 5px solid #007bff;
            border-radius: 4px;
            min-height: 50px;
            white-space: pre-wrap;
        }
        
        .meta-info {
            font-size: 12px;
            color: #6c757d;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Hardware-KI Prototyp UI</h2>
        <p>Gib hier eine Frage ein. Der Server verarbeitet sie mit den simulierten Hardware-Schaltern.</p>

        <textarea id="promptInput" placeholder="Z.B.: Wie wird das Wetter morgen?"></textarea>
        <button onclick="sendPrompt()">Prompt an Engine senden</button>

        <h3>KI Antwort:</h3>
        <div id="output" class="output-box">Noch keine Anfrage gesendet...</div>
        <div id="meta" class="meta-info"></div>
    </div>

    <script>
        async function sendPrompt() {
            const input = document.getElementById('promptInput').value;
            const outputDiv = document.getElementById('output');
            const metaDiv = document.getElementById('meta');

            if (!input) return alert("Bitte gib einen Text ein!");

            outputDiv.innerText = "Die KI denkt nach (Websuche läuft eventuell)...";
            metaDiv.innerText = "";

            try {
                const response = await fetch('/prompt', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: input
                    })
                });

                const data = await response.json();

                if (data.success) {
                    outputDiv.innerText = data.next_word;
                    metaDiv.innerText = `Genutzt von Engine: ${data.model_used}`;
                } else {
                    outputDiv.innerText = "Fehler: " + data.error;
                }
            } catch (err) {
                outputDiv.innerText = "Server-Verbindungsfehler!";
            }
        }
    </script>

</body>

</html>
